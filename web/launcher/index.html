<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Web</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaed; --dim:#9aa0aa; --accent:#5fbf5f; --bad:#e06c6c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  body > canvas { position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; display: block; outline: none; z-index: 1; }
  #ui { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 2; }
  #ui.hidden { display: none; }
  .card { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color .15s; }
  #drop.over, #drop:hover { border-color: var(--accent); }
  #drop b { display: block; margin-bottom: 4px; }
  #drop small { color: var(--dim); }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: #222733; color: var(--text); cursor: pointer; }
  button.go { background: var(--accent); border-color: var(--accent); color: #0b130b; font-weight: 600; flex: 1; }
  button:disabled { opacity: .5; cursor: default; }
  #pack { margin-top: 16px; color: var(--dim); font-size: 14px; }
  #status { margin-top: 16px; min-height: 1.5em; color: var(--dim); font-size: 14px; white-space: pre-wrap; }
  #status.bad { color: var(--bad); }
  progress { width: 100%; margin-top: 8px; height: 8px; display: none; }
  progress.on { display: block; }
</style>
</head>
<body>
<div id="ui">
  <div class="card">
    <h1>Horizon Web</h1>
    <p class="sub">Minecraft 26.3 (Horizon) in your browser</p>
    <div id="drop" tabindex="0">
      <b>Drop your .hzpack here</b>
      <small>or click to pick it (made with mcpack). Stored in this browser, so only once.</small>
      <input id="file" type="file" accept=".hzpack" hidden>
    </div>
    <div id="pack"></div>
    <div class="row">
      <button id="play" class="go" disabled>Play</button>
      <button id="forget" disabled>Forget pack</button>
      <button id="wipe">Delete saves</button>
    </div>
    <progress id="bar" max="1" value="0"></progress>
    <div id="status"></div>
  </div>
</div>
<script type="module" src="./launcher.js"></script>
</body>
</html>
